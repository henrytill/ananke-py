[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ananke"
description = "A password manager"
dynamic = ["version"]
authors = [{ name = "Henry Till", email = "henrytill@gmail.com" }]
license = { file = "COPYING" }
readme = "README.md"
requires-python = ">=3.12"

[project.optional-dependencies]
dev = ["mypy>=1.8.0", "ruff>=0.6.0"]
test = ["coverage>=6.5.0", "cram>=0.7"]

[project.scripts]
ananke-py = "ananke.__main__:main"

# version.py appends the git reference to the base version in VERSION.  The result goes into the package metadata,
# where ananke/__init__.py reads it, rather than into a generated file the type checkers would need to exist.
[tool.hatch.version]
source = "code"
path = "version.py"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# flake8's checks (pycodestyle and pyflakes), isort's and pylint's.
select = ["E", "W", "F", "I", "PL"]
ignore = [
    "PLR0913", # too-many-arguments, i know
    "PLR0917", # too-many-positional-arguments, you already told me thanks
    # eq-without-hash, which pylint never checked: the value wrappers define __eq__ and are unhashable as a result.
    "PLW1641",
]

[tool.ruff.lint.per-file-ignores]
# The base64 ciphertexts in the test cases, which ruff format cannot split.
"tests/test_data.py" = ["E501"]

[tool.mypy]
strict = true
files = ["ananke", "tests", "version.py"]
warn_redundant_casts = false

[tool.coverage.run]
source_pkgs = ["ananke"]
# The cram tests drive the CLI in subprocesses, each of which writes its own
# data file to be combined afterwards.
parallel = true

[tool.coverage.report]
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@abstractmethod"]

[tool.pyright]
# The same sources as mypy's files; without them pyright walks the whole tree, ./result's installed copy included.
include = ["ananke", "tests", "version.py"]
typeCheckingMode = "strict"
