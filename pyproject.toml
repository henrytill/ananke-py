[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ananke"
description = "A password manager"
dynamic = ["version"]
authors = [{ name = "Henry Till", email = "henrytill@gmail.com" }]
license = { file = "COPYING" }
readme = "README.md"
requires-python = ">=3.12"

[project.optional-dependencies]
dev = ["mypy>=1.8.0", "pylint>=3.3.4", "ruff>=0.6.0"]
test = ["coverage>=6.5.0", "cram>=0.7"]

[project.scripts]
ananke-py = "ananke.__main__:main"

# version.py appends the git reference to the base version in VERSION.  The result goes into the package metadata,
# where ananke/__init__.py reads it, rather than into a generated file the type checkers would need to exist.
[tool.hatch.version]
source = "code"
path = "version.py"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# flake8's checks (pycodestyle and pyflakes) and isort's.
select = ["E", "W", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# The base64 ciphertexts in the test cases, which ruff format cannot split.
"tests/test_data.py" = ["E501"]

[tool.mypy]
strict = true
check_untyped_defs = true
warn_redundant_casts = false

[tool.pylint]
max-line-length = 120
disable = [
    "C0114", # missing-module-docstring, too much
    "C0115", # missing-class-docstring, too much
    "C0301", # line-too-long, we use ruff for formatting
    "C0414", # useless-import-alias, we use aliases for type checking
    "R0801", # duplicate-code, no thanks
    "R0903", # too-few-public-methods, come on
    "R0904", # too-many-public-methods, a shared test case is a pile of test methods
    "R0913", # too-many-arguments, i know
    "R0917", # too-many-positional-arguments, you already told me thanks
    "W2301", # unnecessary-ellipsis, yes but i want them
]

[tool.coverage.run]
source_pkgs = ["ananke"]
# The cram tests drive the CLI in subprocesses, each of which writes its own
# data file to be combined afterwards.
parallel = true

[tool.coverage.report]
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@abstractmethod"]

[tool.pyright]
strict = ["ananke", "tests"]
